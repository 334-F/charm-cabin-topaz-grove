<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 450;
        src: url("file:///workspace/.grok/og-fonts/Newsreader-normal-450.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: italic;
        font-weight: 450;
        src: url("file:///workspace/.grok/og-fonts/Newsreader-italic-450.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 500;
        src: url("file:///workspace/.grok/og-fonts/SourceSans3-normal-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 600;
        src: url("file:///workspace/.grok/og-fonts/SourceSans3-normal-600.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fbf9f4;
        color: #1c1916;
      }

      body {
        position: relative;
        font-family: "Source Sans 3", "Liberation Sans", sans-serif;
      }

      .spine {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 18px;
        background: #7a2624;
      }

      .sheet {
        position: absolute;
        inset: 28px 32px 28px 46px;
        border: 1px solid #e4dacc;
      }

      .inner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 92px 0 108px;
      }

      .kicker {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #7a2624;
      }

      h1 {
        margin-top: 18px;
        font-family: "Newsreader", "Liberation Serif", serif;
        font-weight: 450;
        font-size: 108px;
        line-height: 0.88;
        letter-spacing: -0.03em;
      }

      .rule {
        width: 64px;
        height: 2px;
        margin: 28px 0 22px;
        background: #7a2624;
      }

      .role {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.012em;
        line-height: 1.15;
      }

      .role em {
        display: block;
        margin-top: 6px;
        font-family: "Newsreader", "Liberation Serif", serif;
        font-style: italic;
        font-weight: 450;
        font-size: 26px;
        letter-spacing: 0;
      }

      .langs {
        margin-top: 28px;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #5c564e;
      }

      .langs .sep {
        margin: 0 10px;
        color: #7a2624;
      }

      .place {
        margin-top: 22px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #5c564e;
      }

      .zh {
        font-family: "WenQuanYi Zen Hei", "Source Sans 3", sans-serif;
        letter-spacing: 0.12em;
      }

      .portrait {
        width: 196px;
        height: 252px;
        object-fit: cover;
        object-position: center 18%;
        border: 1px solid #e4dacc;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div class="spine"></div>
    <div class="sheet"></div>
    <div class="inner">
      <div class="copy">
        <p class="kicker">Currículum</p>
        <h1>Felipe Xu</h1>
        <div class="rule"></div>
        <p class="role">
          Administrativo bilingüe
          <em>Traductor e intérprete</em>
        </p>
        <p class="langs">
          Español<span class="sep">·</span><span class="zh">中文</span><span class="sep">·</span>English
        </p>
        <p class="place">Madrid</p>
      </div>
      <img class="portrait" src="file:///workspace/public/portrait.jpg" alt="" />
    </div>
  </body>
</html>
